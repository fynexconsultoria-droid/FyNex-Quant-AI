services:
  - type: web
    name: fynex-quant-ai
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: FYNEX_AUTOSTART_BOT
        value: "true"
      - key: FYNEX_BOT_TIMEFRAME
        value: "1h"
      - key: FYNEX_BOT_SYMBOL
        value: "BTC/USDT"
      - key: TRADING_MODE
        value: "paper"
      - key: FYNEX_DASHBOARD_USER
        value: "admin"
      - key: FYNEX_DASHBOARD_PASSWORD
        generateValue: true
