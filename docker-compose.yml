services:
  fynex:
    build: .
    container_name: fynex-quant-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FYNEX_AUTOSTART_BOT=true
      - FYNEX_BOT_TIMEFRAME=1h
      - FYNEX_BOT_SYMBOL=BTC/USDT
    volumes:
      - ./trading_data.db:/app/trading_data.db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
